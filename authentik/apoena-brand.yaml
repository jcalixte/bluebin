# Look of every flow on auth.apoena.dev (sign-in, sign-up, recovery), for
# authentik 2025.10: the apoena.dev style and its toucan. Flows whose slug
# starts with "bluebin-" get the Bluebin style instead.
# Import: authentik admin > Flows and Stages > Flows > Import.
#
# authentik adds the custom CSS to every shadow root of its UI. Only the flow
# page root, <ak-flow-executor>, has the flowslug attribute, so the rules on
# :host([flowslug]) touch flows only. They set --apoena-* and PatternFly
# variables, which every nested stage inherits.
version: 1
metadata:
  name: apoena - Brand
entries:
  - model: authentik_brands.brand
    identifiers:
      domain: authentik-default
    attrs:
      branding_title: apoena
      branding_logo: https://git.apoena.dev/julien/bluebin/raw/branch/main/authentik/apoena-toucan.svg
      branding_favicon: https://git.apoena.dev/julien/bluebin/raw/branch/main/authentik/apoena-toucan.svg
      branding_custom_css: |
        :host([flowslug]) {
          --apoena-font: "Cascadia Mono", "Cascadia Code", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
          --apoena-bg: #ffffff;
          --apoena-text: #2c3e50;
          --apoena-border: rgba(60, 60, 60, 0.12);
          --apoena-primary: #071f88;
          --apoena-primary-hover: #05165f;
          --apoena-on-primary: #ffffff;
          --apoena-logo-size: 5rem;
        }
        :host([flowslug][theme="dark"]) {
          --apoena-bg: #181818;
          --apoena-text: #ebebeb;
          --apoena-border: rgba(84, 84, 84, 0.48);
          --apoena-primary: #99acff;
          --apoena-primary-hover: #b8c5ff;
          --apoena-on-primary: #181818;
        }

        :host([flowslug^="bluebin-"]) {
          --apoena-font: "Inter", ui-sans-serif, system-ui, sans-serif;
          --apoena-text: #18181b;
          --apoena-border: #e4e4e7;
          --apoena-primary: #1e3799;
          --apoena-primary-hover: #182c7a;
          --apoena-logo-size: 4rem;
        }
        :host([flowslug^="bluebin-"][theme="dark"]) {
          --apoena-bg: #1d232a;
          --apoena-text: #e5e7eb;
          --apoena-border: #2a323c;
          --apoena-primary: #7289e3;
          --apoena-primary-hover: #8c9feb;
          --apoena-on-primary: #0d1117;
        }

        :host([flowslug]) {
          --pf-global--FontFamily--sans-serif: var(--apoena-font);
          --pf-global--FontFamily--heading--sans-serif: var(--apoena-font);
          --pf-global--BackgroundColor--light-100: var(--apoena-bg);
          --ak-dark-background: var(--apoena-bg);
          --pf-global--Color--100: var(--apoena-text);
          --ak-dark-foreground: var(--apoena-text);
          --pf-global--primary-color--100: var(--apoena-primary);
          --pf-global--primary-color--200: var(--apoena-primary-hover);
          --pf-global--link--Color: var(--apoena-primary);
          --pf-global--link--Color--hover: var(--apoena-primary-hover);
          --pf-global--link--Color--light: var(--apoena-primary);
          --pf-global--link--Color--light--hover: var(--apoena-primary-hover);
          display: block;
          min-height: 100dvh;
          background-color: var(--apoena-bg);
          color: var(--apoena-text);
          font-family: var(--apoena-font);
        }
        :host([flowslug]) .pf-c-background-image {
          display: none;
        }
        :host([flowslug]) .pf-c-login__main {
          border: 1px solid var(--apoena-border);
          border-radius: 0.375em;
          box-shadow: none;
        }
        :host([flowslug]) .ak-brand {
          padding-top: 2rem;
        }
        :host([flowslug]) .ak-brand img {
          width: var(--apoena-logo-size);
          height: var(--apoena-logo-size);
          padding: 0;
        }
        .pf-c-login__main-header .pf-c-title {
          color: var(--apoena-primary);
          font-weight: bold;
        }
        .pf-c-button {
          --pf-c-button--m-primary--Color: var(--apoena-on-primary, var(--pf-global--Color--light-100));
          --pf-c-button--m-primary--hover--Color: var(--apoena-on-primary, var(--pf-global--Color--light-100));
          --pf-c-button--m-primary--focus--Color: var(--apoena-on-primary, var(--pf-global--Color--light-100));
          --pf-c-button--m-primary--active--Color: var(--apoena-on-primary, var(--pf-global--Color--light-100));
        }

        :host([flowslug^="bluebin-"]) {
          background-color: transparent;
        }
        :host([flowslug^="bluebin-"]) .pf-c-background-image {
          display: block;
        }
        :host([flowslug^="bluebin-"]) .pf-c-login__main {
          border: 0;
        }
        :host([flowslug^="bluebin-"]) .ak-brand img {
          display: none;
        }
        :host([flowslug^="bluebin-"]) .ak-brand::before {
          content: "";
          width: var(--apoena-logo-size);
          height: var(--apoena-logo-size);
          background: url("https://git.apoena.dev/julien/bluebin/raw/branch/main/public/favicon.svg") center / contain no-repeat;
        }
