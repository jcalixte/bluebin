# Look of every flow on auth.apoena.dev (sign-in, sign-up, recovery), for
# authentik 2025.10: the apoena.dev style and its toucan. Bluebin flows have
# their own brand on auth.bluebin.app (bluebin-brand.yaml).
# Import: authentik admin > Flows and Stages > Flows > Import.
#
# The sign-in flow "apoena-authentication" reuses the stages of
# default-authentication-flow, so an authentik upgrade that re-applies the
# default blueprint cannot reset its title.
#
# authentik adds the custom CSS to every shadow root of its UI. Only the flow
# page root, <ak-flow-executor>, has the flowslug attribute, so the rules on
# :host([flowslug]) touch flows only. They set --apoena-* and PatternFly
# variables, which every nested stage inherits.
version: 1
metadata:
  name: apoena - Brand
entries:
  - model: authentik_flows.flow
    id: flow
    identifiers:
      slug: apoena-authentication
    attrs:
      name: apoena sign-in
      title: Hi! Sign in to apoena.
      designation: authentication
      authentication: none
      layout: stacked

  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf flow
      stage: !Find [authentik_stages_identification.identificationstage, [name, default-authentication-identification]]
      order: 10
  - model: authentik_flows.flowstagebinding
    id: password-binding
    identifiers:
      target: !KeyOf flow
      stage: !Find [authentik_stages_password.passwordstage, [name, default-authentication-password]]
      order: 20
    attrs:
      re_evaluate_policies: true
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf password-binding
      policy: !Find [authentik_policies_expression.expressionpolicy, [name, default-authentication-flow-password-stage]]
      order: 10
    attrs:
      failure_result: true
  - model: authentik_flows.flowstagebinding
    id: mfa-binding
    identifiers:
      target: !KeyOf flow
      stage: !Find [authentik_stages_authenticator_validate.authenticatorvalidatestage, [name, default-authentication-mfa-validation]]
      order: 30
  # A passkey sign-in (passkey.yaml) is already strong: skip the second factor.
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf mfa-binding
      policy: !Find [authentik_policies_expression.expressionpolicy, [name, default-authentication-flow-authenticator-validate-stage]]
      order: 10
    attrs:
      failure_result: true
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf flow
      stage: !Find [authentik_stages_user_login.userloginstage, [name, default-authentication-login]]
      order: 100

  - model: authentik_brands.brand
    identifiers:
      domain: authentik-default
    attrs:
      flow_authentication: !KeyOf flow
      branding_title: apoena
      branding_logo: https://git.apoena.dev/julien/bluebin/raw/branch/main/authentik/apoena-toucan.svg
      branding_favicon: https://git.apoena.dev/julien/bluebin/raw/branch/main/authentik/apoena-toucan.svg
      branding_custom_css: |
        :host([flowslug]) {
          --apoena-font: "Cascadia Mono", "Cascadia Code", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
          --apoena-bg: #ffffff;
          --apoena-text: #2c3e50;
          --apoena-primary: #071f88;
          --apoena-primary-hover: #05165f;
          --apoena-on-primary: #ffffff;
        }
        :host([flowslug][theme="dark"]) {
          --apoena-bg: #181818;
          --apoena-text: #ebebeb;
          --apoena-primary: #99acff;
          --apoena-primary-hover: #b8c5ff;
          --apoena-on-primary: #181818;
        }

        :host([flowslug]) {
          --pf-global--FontFamily--sans-serif: var(--apoena-font);
          --pf-global--FontFamily--heading--sans-serif: var(--apoena-font);
          --pf-global--BackgroundColor--light-100: var(--apoena-bg);
          --ak-dark-background: var(--apoena-bg);
          --pf-global--Color--100: var(--apoena-text);
          --ak-dark-foreground: var(--apoena-text);
          --pf-global--primary-color--100: var(--apoena-primary);
          --pf-global--primary-color--200: var(--apoena-primary-hover);
          --pf-global--link--Color: var(--apoena-primary);
          --pf-global--link--Color--hover: var(--apoena-primary-hover);
          --pf-global--link--Color--light: var(--apoena-primary);
          --pf-global--link--Color--light--hover: var(--apoena-primary-hover);
          --pf-global--spacer--form-element: 0.625rem;
          --pf-global--FontSize--3xl: clamp(1.75rem, 1.4rem + 1.5vw, 2.25rem);
          --pf-global--FontSize--sm: 0.9375rem;
          display: block;
          min-height: 100dvh;
          color: var(--apoena-text);
          font-family: var(--apoena-font);
          background-color: var(--apoena-bg);
        }
        :host([flowslug]) .ak-brand img {
          width: 80px;
          height: 80px;
          padding: 0;
        }
        .pf-c-login__main-header .pf-c-title {
          color: var(--apoena-primary);
          font-weight: 700;
          line-height: 1.2;
        }
        .pf-c-button {
          --pf-c-button--m-primary--Color: var(--apoena-on-primary, var(--pf-global--Color--light-100));
          --pf-c-button--m-primary--hover--Color: var(--apoena-on-primary, var(--pf-global--Color--light-100));
          --pf-c-button--m-primary--focus--Color: var(--apoena-on-primary, var(--pf-global--Color--light-100));
          --pf-c-button--m-primary--active--Color: var(--apoena-on-primary, var(--pf-global--Color--light-100));
        }

        :host([flowslug]) .pf-c-background-image {
          display: none;
        }
        :host([flowslug]) .pf-c-login__main {
          margin-top: 0;
          box-shadow: none;
        }
        :host([flowslug]) .ak-brand {
          justify-content: flex-start;
          padding-top: 2rem;
          padding-bottom: 0;
        }
