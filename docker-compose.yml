services:
  web:
    build: .
    # Coolify's Traefik owns host port 80 and routes to this container by
    # label, so the port is exposed to the Docker network, never published.
    expose:
      - "80"
    # Every request must pass authentik SSO (auth.apoena.dev, provider and app
    # "bluebin", group "bluebin-users"). Coolify attaches any middleware defined
    # here to all routers of this service, after its www redirect.
    labels:
      - traefik.http.middlewares.bluebin-sso.forwardauth.address=http://authentik-server-yttc0v4j98b678ckc2lwuzz5:9000/outpost.goauthentik.io/auth/traefik
      - traefik.http.middlewares.bluebin-sso.forwardauth.trustForwardHeader=true
      - traefik.http.middlewares.bluebin-sso.forwardauth.authResponseHeaders=X-authentik-username,X-authentik-email,X-authentik-name,X-authentik-uid,X-authentik-groups
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      # busybox wget, shipped with nginx:alpine.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  api:
    build: ./backend
    environment:
      - PORT=8000
    volumes:
      - bluebin-data:/app/data
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  bluebin-data:
