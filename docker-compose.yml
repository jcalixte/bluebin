services:
  web:
    build: .
    # Coolify's Traefik owns host port 80 and routes to this container by
    # label, so the port is exposed to the Docker network, never published.
    expose:
      - "80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      # busybox wget, shipped with nginx:alpine.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  api:
    build: ./backend
    environment:
      - PORT=8000
    volumes:
      - bluebin-data:/app/data
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  bluebin-data:
