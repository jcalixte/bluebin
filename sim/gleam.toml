name = "simulation"
version = "1.0.0"
target = "javascript"

# The Line routes of the API, compiled to JavaScript and run in the browser on
# an in-memory SQLite (see src/simulation.gleam and the SPA's src/simulation/).
[dependencies]
bluebin = { path = "../backend" }
gleam_stdlib = ">= 1.0.0 and < 2.0.0"
gleam_http = ">= 4.3.0 and < 4.4.0"
sqlight = ">= 1.2.0 and < 2.0.0"
wisp = ">= 2.2.2 and < 3.0.0"

[javascript]
typescript_declarations = true

[dev-dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
