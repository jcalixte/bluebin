server {
  listen 80;
  root /usr/share/nginx/html;

  # Vite puts a content hash in every asset name: keep each one for good.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;

    # SQLite in WebAssembly: the browser compiles it while it downloads only
    # with this type, which older mime.types files lack.
    location ~ \.wasm$ {
      types {}
      default_type application/wasm;
      add_header Cache-Control "public, max-age=31536000, immutable";
    }
  }

  # Every other path is a view of the SPA (`/line`, `/next`…), so a reload works.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
